<body>
    <div class="app-payoo">

            </div>
            <div class="left">

                    <button class="button">
                      <i class="ri-logout-box-r-line"></i>Log Out

                </a>
            </div>
        </nav>

    <!-- scrtion-1 -->
     <section class="sec-1">
        <h2>Welcome to Pay<span>oo</span></h2>
        <p>Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
     </section>
     <!-- section-2 -->
      <section class="sec-2">
        <a href="add-mony.html">
            <div class="box">
            <div class="img">
              <img src="./payoo-resources/assets/opt-1.png" alt="">
            </div>
            <p>Add Mony</p>
        </div>
        </a>
        <a href="cashout.html">
            <div class="box">
            <div class="img">
                <img src="./payoo-resources/assets/opt-2.png" alt="">
            </div>
            <p>Cashout</p>
        </div>
        </a>
        <a href="transfer.html">
            <div class="box">
            <div class="img">
                <img src="./payoo-resources/assets/opt-3.png" alt="">

            <p>Transfer Money</p>
        </div>
        </a>
        <a href="bonus.html">

            <p>Get Bonus</p>
        </div>
        </a>
        <a href="pay.html">
            <div class="box">
            <div class="img">
                <img src="./payoo-resources/assets/opt-5.png" alt="">

        </div>
        </a>

            </div>

        </div>

      <!-- sce-3 -->
       <section class="sec-3">
          <div class="titel">
              <h3>Add Mony</h3>
          </div>
          <div class="form">
            <div class="in">
                <!-- number -->
                <h4 id="j">Select Bank</h4>
                <select name="" id="number">
                    <option value="Select a Bank">Select a Bank</option>
                    <option value="DBBL">DBBL</option>
                    <option value="Soutn East Bank">South East Bank</option>
                    <option value="Brack Bank">Brack Bank</option>
                    <option value="AB Bank">AB Bank</option>
                    <option value="Sonali Bank">Sonali Bank</option>
                </select>

                <!-- pin -->
                <h4>Bank Account Number</h4>
                <input type="text" id="pin" class="acc" maxlength="11" placeholder="Enter 11 Digit AC Number">
                <br>
                <h4 id="i">Ammount To Add</h4>
                <input type="text" id="pin" class="amount" maxlength="5" placeholder="Ammout to add">
                <br>
                <h4 id="i">4 Digit Pin</h4>
                <input type="password" id="pin" class="pin" maxlength="4" placeholder="Please enter 4 Digit Pin">
                <br>
                <button class="btn" type="buttone">Add Money</button>
            </div>
       </section>

    <script src="add-mony.js"></script>
