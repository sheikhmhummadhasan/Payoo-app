<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo</title>
    <link rel="shortcut icon" href="./payoo-resources/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
     <div class="payoo-app">
          <!-- logo -->
        <div class="logo">
            <img src="./payoo-resources/assets/Logo-full.png" alt="">
        </div>

          <!-- form -->
        <div class="form">
            <div class="in">
                <!-- number -->
                <h4>Phone Number</h4>
                <input type="text" id="number" maxlength="11" placeholder="Enter Your Mobile Number">

                <!-- pin -->
                <h4>4 Digit pin</h4>
                <input type="password" id="pin" maxlength="4" placeholder="Enter 4 Digit Pin">
                <br>
                <button class="btn" type="button">Login</button>
            </div>
       </div>
     </div>

    <script src="script.js"></script>
</body>
</html>
